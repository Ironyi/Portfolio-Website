<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="Favico.png" type="image/png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <link rel="stylesheet" href="styles.css" />
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
 
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  
</head>
<body>
  <div id="header-placeholder"></div>



  <div class="contact-container slide-up">
    <div class="contact-form slide-up">
      
      <section class="contact-wrapper slide-up">
        <div class="contact-card">
          <div class="contact-heading-row">
            <p class="subheading">Get in touch</p>
            <div class="linkedin-inline">
              <a href="https://www.linkedin.com/in/ian-j-kuo" target="_blank" class="linkedin-btn">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg" alt="LinkedIn" />
                Connect
              </a>
            </div>
          </div>
          
          
          <h1 class="contact-title">Contact.</h1>

          
      
          <form id="contact-form" data-service-id="service_3h7ty7t" data-template-id="template_2xc852t" data-public-key="V1CzIU7XIPLjwgWPT">
            <div class="form-row">
              <label>
                <span class="icon-label"><i class="fas fa-user"></i> Name</span>
                <input type="text" name="name" placeholder="Your name" required />
              </label>
              
              <label>
                <span class="icon-label"><i class="fas fa-envelope"></i> Email</span>
                <input type="email" name="email" placeholder="Your email" required />
              </label>
              
              <label class="full">
                <span class="icon-label"><i class="fas fa-comment-dots"></i> Message</span>
                <textarea name="message" placeholder="Your message..." rows="5" required></textarea>
              </label>
              
            </div>
            <div class="captcha-wrap">
              <div class="cf-turnstile" data-sitekey="0x4AAAAAACZMI4_SPT5YSKz9" data-theme="dark"></div>
            </div>
            <button type="submit" class="btn-submit">Send</button>
            <p id="contact-status" class="form-status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </div>

    <div class="contact-visual">
      <img src="images/Clear-bear.png"/>
    </div>
  </div>
  <script src="inject-header.js"></script>
  <script src="app.js"></script>
</body>
</html>
